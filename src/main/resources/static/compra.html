<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/src/main/resources/static/styles/styles.css">
    <link rel="stylesheet" href="/src/main/resources/static/styles/compra.css">

    <script src="/src/main/resources/static/scripts/fornecedor.js" defer></script>
    <script src="/src/main/resources/static/scripts/compra.js" defer></script>

    <title>Compra</title>
</head>

<body>

    <main class="container">

        <section class="caixa-compra">

            <h1>Realizar Compra</h1>

            <form id="formProduto">

                <div class="campo">

                    <label for="nomeProduto">
                        Nome do produto
                    </label>

                    <input
                        type="text"
                        id="nomeProduto"
                        placeholder="Digite o nome do produto"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="precoProduto">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="precoProduto"
                        placeholder="Digite o preço"
                        step="0.01"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="quantidadeProduto">
                        Quantidade em estoque
                    </label>

                    <input
                        type="number"
                        id="quantidadeProduto"
                        placeholder="Digite a quantidade"
                        min="0"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="fornecedor">
                        Fornecedor
                    </label>

                    <select id="fornecedor" required>

                        <option value="">
                            Selecione um fornecedor
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="botao-comprar"
                >
                    Cadastrar
                </button>

            </form>

        </section>

    </main>

</body>

</html>
