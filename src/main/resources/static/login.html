<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bem-Vindo(a) </title>
    <link rel="stylesheet" href="styles/login.css">
</head>

<body>
    <form action="/login" method="post">
        <label for="identificador">Insira o seu username</label>
        <input type="text" id="username" name="identificador" placeholder="usuario123" required>

        <label for="senha">Insira sua senha</label>
        <input type="password" id="senha" name="senha_hash" placeholder="******" required>

        <button type="submit">Enviar</button>
    </form>

    <div id="popup-erro" class="popup-fundo">
        <div class="popup-caixa">
            <h3 class="titulo-erro">Erro no login</h3>
            <p>Username ou senha incorretos.</p>
            <button type="button" id="popup-fechar">OK</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const popup = document.getElementById('popup-erro');

        // Guarda username e senha para exibir na tela seguinte
        document.querySelector('form').addEventListener('submit', () => {
            sessionStorage.setItem('nomeLogin', document.getElementById('identificador').value);
            sessionStorage.setItem('senhaLogin', document.getElementById('senha').value);
        });

        // Login errado: mostra o pop-up e limpa o que foi guardado
        if (params.get('error') === 'true') {
            sessionStorage.removeItem('nomeLogin');
            sessionStorage.removeItem('senhaLogin');
            popup.style.display = 'flex';
        }

        document.getElementById('popup-fechar').addEventListener('click', () => {
            popup.style.display = 'none';
            window.history.replaceState({}, '', 'login.html');
        });
    </script>
</body>

</html>
